<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flor amarilla grande</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="scene" id="scene">

    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <header class="title-wrap">
      <h1 id="title" contenteditable="true" spellcheck="false">Mi jardín de flores amarillas</h1>
      <p id="subtitle" contenteditable="true" spellcheck="false">Toca aquí para escribir un subtítulo</p>
    </header>

    <div class="butterfly b1">🦋</div>
    <div class="butterfly b2">🦋</div>
    <div class="butterfly b3">🦋</div>

    <div class="garden">

      <div class="big-flower" id="bigFlower">
        <div class="stem big-stem"></div>
        <div class="leaf big-leaf left"></div>
        <div class="leaf big-leaf right"></div>
        <div class="bloom big-bloom">
          <div class="petal"></div><div class="petal"></div><div class="petal"></div>
          <div class="petal"></div><div class="petal"></div><div class="petal"></div>
          <div class="petal"></div><div class="petal"></div>
          <div class="center big-center"></div>
        </div>
      </div>

      <div class="field" id="field"></div>

    </div>

    <div class="ground"></div>

    <div class="controls">
      <button id="petalsBtn" class="petal-btn">🌼 Soltar pétalos</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
