<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Para Jaasiel 🌻</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading">
    <div class="loading-orbit"></div>
    <div class="loading-flower">🌻</div>
    <h1>Para Jaasiel</h1>
    <p>Un pequeño universo hecho con cariño ✨</p>
    <button id="enter">Dale click 💛</button>
  </div>

  <div id="app" class="hidden">
    <canvas id="stars"></canvas>
    <div class="nebula nebula-a"></div>
    <div class="nebula nebula-b"></div>
    <div class="gold-dust"></div>

    <div id="universe">
      <div id="ring"></div>
      <div id="flowers"></div>
    </div>

    <section class="heading">
      <div class="eyebrow">✦ un universo para ti ✦</div>
      <h1>Feliz día de las</h1>
      <h2>Flores Amarillas <span>🌻</span></h2>
    </section>

    <div id="center">
      <div id="heartGlow"></div>
      <canvas id="heart"></canvas>
      <div id="heartText">JAASIEL</div>
      <div id="loveText"></div>
    </div>

    <div id="bottomMessage">✨ Para alguien muy especial ✨</div>
    <div id="tip">Gira el universo • toca la pantalla</div>
    <button id="reset" class="smallBtn">↻</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
